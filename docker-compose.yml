services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arvores}
      POSTGRES_USER: ${POSTGRES_USER:-arvores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arvores}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arvores}
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Throwaway database for pytest: docker compose --profile test run --rm tests
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: arvores_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d arvores_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    build: .
    profiles: ["test"]
    user: root
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@db-test:5432/arvores_test
    command: sh -c "pip install -q -r requirements-dev.txt -c requirements.lock && pytest -q"
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
